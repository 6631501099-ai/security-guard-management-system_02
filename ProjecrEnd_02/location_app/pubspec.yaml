name: location_app
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '^3.9.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  firebase_storage: 11.7.7
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  firebase_database: ^10.5.7
  cloud_firestore: ^4.17.5
  google_maps_flutter: ^2.14.2
  geolocator: ^10.1.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.2
  intl: ^0.19.0 # used by CheckInOutScreen for the live clock / date labels

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icon02.png


flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon02.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icon02.png"